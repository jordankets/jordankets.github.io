<!DOCTYPE html>
<html>
<head>
	<title>jurgenbert.com</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="style.css" type="text/css">
<style>
	* {
		font-family: verdana;
	}
	.pokemonkaart {
		border-radius: 15px;
		width: 300px;
		padding: 10px;
		margin: 10px;
		float: left;
	}
	.achtergrond-geel {
		background-color: rgba(255, 255, 0, 0.3)
	}
	.achtergrond-groen {
		background-color: rgba(0, 255, 0, 0.3)
	}
	h1 { 
		color: black;
		text-align: center;
	}
	h4 {
		color: gray;
		text-align: center;
	}
	img {
		width: 215px;
	}
	.type1 {
		border-radius: 25px;
		background-color: yellow;
		text-align: center;
		margin-left: 20%;
		margin-right: 20%;
		padding-top: 10px;
		padding-bottom: 10px;
	}
	p {
		text-align: center;
	}
</style>
</head>

<body>
	<div class="pokemonkaart achtergrond-geel">
		<h1>Pikachu</h1>
		<h4>#0025</h4>
		<p><img src="025.png"></p>
		<p class="type1">Electric</p>
		<p>35 HP - 90 speed</p>
	</div>
	<div class="pokemonkaart achtergrond-groen">
		<h1>Bulbasaur</h1>
		<h4>#0001</h4>
		<p><img src="001.png"></p>
		<p class="type1">Grass</p>
		<p>45 HP - 45 speed</p>
	</div>
</body>
</html>
